name: ETF市值与沪深300指数自动采集

on:
  workflow_dispatch:
  schedule:
    - cron: '45 9 * * 1-5'
      timezone: Asia/Shanghai

permissions:
  contents: write

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 下载仓库代码
        uses: actions/checkout@v4
      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 采集ETF市值与沪深300指数
        run: python market_collector.py
      - name: 采集全部沪深300ETF候选基金市值
        continue-on-error: true
        run: python all_etf_collector.py
      - name: 尝试采集沪深300成分股历史自由流通市值
        continue-on-error: true
        run: python float_cap_collector.py
      - name: 保存采集结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/etf_market_components.csv data/csi300_index_history.csv
          if [ -f data/all_csi300_etf_market.csv ]; then git add data/all_csi300_etf_market.csv; fi
          if [ -f data/csi300_float_cap_observed.csv ]; then git add data/csi300_float_cap_observed.csv; fi
          if [ -f data/etf_market_ratio.csv ]; then git add data/etf_market_ratio.csv; fi
          if ! git diff --cached --quiet; then
            git commit -m "自动更新ETF市值和沪深300指数"
            git pull --rebase
            git push
          fi
